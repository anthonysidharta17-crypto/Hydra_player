name: Instalar projeto
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: unzip -q -o src/projeto.zip && rm src/projeto.zip
      - name: Salvar
        run: git config user.name github-actions && git config user.email a@b.c && git add -A && git commit -m "Atualiza projeto" && git push
