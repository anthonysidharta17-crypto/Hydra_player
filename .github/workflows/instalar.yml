name: Instalar projeto
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          f=$(ls projeto.zip src/projeto.zip 2>/dev/null | head -n 1)
          if [ -z "$f" ]; then
            echo "projeto.zip não encontrado na raiz nem em src"
            exit 1
          fi
          unzip -q -o "$f"
          rm "$f"
      - name: Salvar
        run: |
          git config user.name github-actions
          git config user.email a@b.c
          git add -A
          git commit -m "Atualiza projeto" || echo "Nada para salvar"
          git push
