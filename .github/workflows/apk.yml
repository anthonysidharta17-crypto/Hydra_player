name: Gerar APK
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Instalar e compilar o site
        run: |
          npm install
          npm run build
        env: { VITE_BASE: ./ }

      - name: Instalar Capacitor e criar o projeto Android
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3 --no-save
          npx cap add android

      - name: Ícones (só se existirem em assets/ ou resources/)
        run: |
          if [ -n "$(ls -A assets resources 2>/dev/null)" ]; then
            npx capacitor-assets generate --android || echo "Ícones não gerados; seguindo com o ícone padrão."
          else
            echo "Sem pasta de ícones; seguindo com o ícone padrão."
          fi

      - name: Permissões, versão e chave fixa
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # permissões extras (INTERNET já vem no projeto)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' "$M"
          # tráfego http liberado
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          # versão = número da execução
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.2.${{ github.run_number }}\"/" "$G"
          # chave de debug fixa: o APK novo instala por cima do antigo
          mkdir -p ~/.android
          cp signing/hydra-debug.keystore ~/.android/debug.keystore
          grep -n "INTERNET\|ACCESS_NETWORK_STATE\|WAKE_LOCK\|usesCleartextTraffic" "$M"
          grep -n "versionCode\|versionName" "$G"

      - name: Sincronizar e compilar o APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hydra-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-player-apk
          path: Hydra-Player.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" Hydra-Player.apk \
            --title "Hydra Player 1.2.${{ github.run_number }}" \
            --notes "APK de teste (debug). Se o Android pedir, permita instalar de fontes desconhecidas."
