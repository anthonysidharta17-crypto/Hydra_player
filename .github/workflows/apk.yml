name: Gerar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: ./
      - run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3 --no-save
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hydra-player.apk
          gh release create "apk-${{ github.run_number }}" hydra-player.apk --title "Hydra Player APK ${{ github.run_number }}" --notes "APK de teste"
